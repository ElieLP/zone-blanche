name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    steps:
      - name: Trust the server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy this commit
        run: ssh deploy@${{ vars.DEPLOY_HOST }} /srv/zone-blanche/scripts/deploy.sh ${{ github.sha }}
      - name: Check the server answers a train
        # Straight to the server (Cloudflare may challenge CI runners), with its real certificate.
        run: |
          site="https://${{ vars.DOMAIN }}"
          resolve="${{ vars.DOMAIN }}:443:${{ vars.DEPLOY_HOST }}"
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --resolve "$resolve" "$site/api/trains/6111/$(date +%F)" || true)
            echo "Attempt $attempt: $status"
            [ "$status" = 200 ] || [ "$status" = 404 ] && exit 0
            sleep 5
          done
          exit 1
